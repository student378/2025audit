<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활관</title>
<meta name="description" content="대학교 생활관 홈페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip" href="#content">본문 바로가기</a>
<div id="previewBar" class="preview-bar" hidden>관리자 미리보기 모드입니다. 저장(배포) 전 내용이 표시됩니다.</div>

<header id="header" class="header">
  <div class="topbar">
    <div class="inner">
      <span class="topbar-univ" id="topUniv"></span>
      <ul class="toplinks" id="topLinks"></ul>
    </div>
  </div>
  <div class="hd">
    <div class="inner">
      <h1 class="logo"><a href="#/" id="logo"></a></h1>
      <nav class="gnb" aria-label="주 메뉴"><ul id="gnb"></ul></nav>
      <button class="btn-allmenu" id="btnAllMenu" aria-label="전체메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="gnb-bg"></div>
</header>

<div class="mnav" id="mnav" aria-hidden="true">
  <div class="mnav-panel">
    <div class="mnav-hd"><strong id="mnavTitle"></strong><button class="mnav-close" id="mnavClose" aria-label="전체메뉴 닫기">&times;</button></div>
    <ul class="mnav-list" id="mnavList"></ul>
  </div>
</div>

<main id="content" tabindex="-1"></main>

<footer class="footer">
  <div class="ft-links">
    <div class="inner">
      <ul id="ftLinks"></ul>
      <div class="family">
        <select id="familySel" aria-label="관련 사이트"><option value="">관련 사이트</option></select>
        <button type="button" id="familyGo">이동</button>
      </div>
    </div>
  </div>
  <div class="inner ft-body">
    <div class="ft-logo" id="ftLogo"></div>
    <address id="ftAddr"></address>
    <p class="copy" id="ftCopy"></p>
  </div>
</footer>

<button class="totop" id="toTop" aria-label="맨 위로">TOP</button>
<div id="popups"></div>

<script src="assets/icons.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
